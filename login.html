<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Prihlásenie: prehľad techniky</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%BB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --paper:#EFF1EB; --surface:#FAFBF8; --ink:#1B2932; --ink-2:#4A5960; --ink-3:#7B8786; --line-2:#BCC4B8;
  --o:#27466F; --ho:#DE9C2C; --dov:#2E8A76; --nem:#BE4A5D; --nem-ink:#7A2838; --sc:#6C5DB5;
  --font:"Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --paper:#11171C; --surface:#182026; --ink:#E3E8E2; --ink-2:#A6B0AC; --ink-3:#727D7A; --line-2:#3A464D;
    --o:#8FB0DD; --ho:#E8AE4A; --dov:#5BC0A7; --nem:#E57A8C; --nem-ink:#F3AEBA; --sc:#9E90E6;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --paper:#11171C; --surface:#182026; --ink:#E3E8E2; --ink-2:#A6B0AC; --ink-3:#727D7A; --line-2:#3A464D;
  --o:#8FB0DD; --ho:#E8AE4A; --dov:#5BC0A7; --nem:#E57A8C; --nem-ink:#F3AEBA; --sc:#9E90E6;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;display:flex;align-items:center}
.wrap{width:100%;max-width:1320px;margin:0 auto;padding:32px clamp(20px,5vw,64px)}
.brand{margin:0 0 clamp(20px,4vw,36px);font-weight:600;font-size:.9375rem;color:var(--ink-2)}
h1{margin:0;font-size:clamp(3rem,9vw,6.5rem);font-weight:760;font-stretch:75%;line-height:.88;letter-spacing:-.025em;max-width:12ch}
.dots{display:flex;gap:8px;margin:clamp(22px,4vw,34px) 0 clamp(26px,4vw,40px)}
.dots span{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 -1.5px 0 rgba(0,0,0,.2)}
form{max-width:30rem}
label{display:block;font-weight:600;margin-bottom:8px}
.row{display:flex;gap:8px}
input[type=password]{flex:1;min-width:0;height:48px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;font-size:1rem;padding:0 14px}
button{height:48px;padding:0 20px;border:1px solid var(--ink);border-radius:10px;background:var(--ink);color:var(--surface);font:inherit;font-size:1rem;font-weight:620;cursor:pointer}
button:hover{opacity:.92}
:where(button,input):focus-visible{outline:2px solid var(--o);outline-offset:2px}
input[aria-invalid="true"]{border-color:var(--nem)}
.err{margin:10px 0 0;color:var(--nem-ink);font-weight:600}
.foot{margin:18px 0 0;color:var(--ink-3);font-size:.9375rem}
[hidden]{display:none !important}
</style>
</head>
<body>
<main class="wrap">
  <p class="brand">Sales tím: prehľad techniky</p>
  <h1>S&nbsp;čím pracuješ?</h1>
  <div class="dots" aria-hidden="true">
    <span style="background:var(--o)"></span><span style="background:var(--ho)"></span><span style="background:var(--dov)"></span><span style="background:var(--nem)"></span><span style="background:var(--sc)"></span>
  </div>
  <form method="post" action="/api/login">
    <label for="pw">Tímové heslo</label>
    <div class="row">
      <input id="pw" name="password" type="password" autocomplete="current-password" required autofocus aria-describedby="err">
      <button type="submit">Vstúpiť</button>
    </div>
    <input type="hidden" name="next" id="next" value="/">
    <p class="err" id="err" role="alert" hidden>Heslo nesedí. Skús to znova.</p>
  </form>
  <p class="foot">Heslo ti pošle vedúci tímu. Netreba žiadny účet, stačí heslo. Prehliadač si prihlásenie zapamätá na 30 dní.</p>
</main>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  if(q.get('chyba')){ document.getElementById('err').hidden = false; document.getElementById('pw').setAttribute('aria-invalid','true'); }
  var n = q.get('next') || '';
  if(n.charAt(0) === '/' && n.charAt(1) !== '/' && n.charAt(1) !== '\\') document.getElementById('next').value = n;
})();
</script>
</body>
</html>
